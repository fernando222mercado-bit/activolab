name: ${COMPOSE_PROJECT_NAME:-inventario-activos}

services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configura MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - red_inventario
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build:
      context: ./app
    image: ${APP_IMAGE:-inventario-activos:local}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_NAME: ${APP_NAME:-Inventario de Activos}
      ORG_NAME: ${ORG_NAME:-Organizacion de demostracion}
      APP_USERNAME: ${APP_USERNAME:?Configura APP_USERNAME en .env}
      APP_PASSWORD: ${APP_PASSWORD:?Configura APP_PASSWORD en .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Configura FLASK_SECRET_KEY en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_inventario
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - red_inventario

networks:
  red_inventario:
    driver: bridge

volumes:
  db_data:
