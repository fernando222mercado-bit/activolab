{% extends 'base.html' %}
{% block title %}Mi cuenta · {{ app_name }}{% endblock %}
{% block content %}<section class="page-title-row"><div><span class="eyebrow">MI PERFIL</span><h1>{{ usuario.nombre }}</h1><p class="muted">{{ usuario.username }} · {{ roles[usuario.rol] }}</p></div></section><section class="panel form-panel"><form method="post" class="equipment-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h2>Cambiar contraseña</h2><div class="form-grid"><label>Contraseña actual<input type="password" name="current_password" required maxlength="120" autocomplete="current-password"></label><label>Nueva contraseña<input type="password" name="password" required minlength="10" maxlength="120" autocomplete="new-password"></label><label>Confirmar contraseña<input type="password" name="confirm_password" required minlength="10" maxlength="120" autocomplete="new-password"></label></div><div class="form-actions"><button class="btn btn-primary">Cambiar contraseña</button></div></form></section>{% endblock %}
