{% extends 'base.html' %}
{% block title %}Configuración · {{ app_name }}{% endblock %}
{% block content %}<section class="page-title-row"><div><span class="eyebrow">PERSONALIZACIÓN</span><h1>Configuración general</h1><p class="muted">Identidad visible del sistema. Los cambios se conservan en MySQL.</p></div></section><section class="panel form-panel"><form method="post" class="equipment-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Nombre del sistema<input name="app_name" required maxlength="120" value="{{ app_name }}"></label><label>Organización<input name="org_name" required maxlength="120" value="{{ org_name }}"></label></div><div class="form-actions"><button class="btn btn-primary">Guardar configuración</button></div></form></section>{% endblock %}
