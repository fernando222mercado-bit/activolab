{% extends 'base.html' %}
{% block content %}
<div class="back-row"><a href="{{ url_for('index') }}">← Inventario</a></div>
<section class="page-title-row"><div><span class="eyebrow">INVENTARIO POR CANTIDAD</span><h1>Registrar consumible</h1><p class="muted">Una ficha por SKU, sin números de serie.</p></div></section>
<section class="panel form-panel"><form class="equipment-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<label>SKU<input name="sku" required maxlength="30" placeholder="CB-001"></label><label>Descripción<input name="descripcion" required maxlength="180"></label>
<label>Categoría<select name="tipo_id" required>{% for t in tipos %}<option value="{{ t.id }}">{{ t.nombre }}</option>{% endfor %}</select></label><label>Ubicación<input name="ubicacion" required maxlength="120" placeholder="Almacén / Área D1"></label>
<label>Cantidad inicial<input type="number" name="cantidad" min="0" max="1000000" value="0" required></label><label>Existencia mínima<input type="number" name="minimo" min="0" max="1000000" value="0" required></label></div><div class="form-actions"><button class="btn btn-primary">Registrar consumible</button></div></form></section>
{% endblock %}
